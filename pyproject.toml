[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stormcast"
version = "0.1.0"
description = "Radar + Himawari-9 data pipeline and deep-learning models for convective storms over Ho Chi Minh City"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
    "xarray>=2024.10",
    "zarr>=2.17",
    "netcdf4>=1.6",
    "scipy>=1.10",
    "dask>=2024.1",
    "boto3>=1.34",
    "satpy>=0.50",
    "pyresample>=1.28",
    "arm_pyart>=1.18",
]

[project.optional-dependencies]
orchestration = ["dagster>=1.8", "dagster-webserver>=1.8"]
ml = ["torch>=2.2", "mlflow>=2.12", "opencv-python-headless>=4.8", "matplotlib>=3.8"]
analysis = ["duckdb>=1.0", "matplotlib>=3.8", "cartopy>=0.23", "jupyterlab>=4"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
stormcast = "stormcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
